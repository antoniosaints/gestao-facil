openapi: 3.1.0
info:
  title: GestaoFacil Restaurante API
  version: 1.0.0
servers:
  - url: /api/v1/restaurante
paths:
  /acesso:
    get:
      summary: Retorna papeis e capacidades efetivas do usuario no Restaurante
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: Papeis, capacidades e indicador de fallback legado }
        '403': { description: App Restaurante inativo }
  /usuarios-papeis:
    get:
      summary: Lista usuarios da conta e seus papeis no Restaurante
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: Usuarios e papeis }
        '403': { description: Capacidade PAPEIS_GERENCIAR necessaria }
  /usuarios-papeis/{usuarioId}:
    put:
      summary: Substitui os papeis de um usuario no Restaurante
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Papeis atualizados }
        '403': { description: Capacidade PAPEIS_GERENCIAR necessaria }
        '404': { description: Usuario fora da conta ou inexistente }
  /publico/{slug}/cardapio:
    get:
      summary: Consulta o cardapio publico ativo e seu estado de atendimento atual
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Restaurante com nome, logo, estado aberto/fechado, cardapio e produtos disponiveis }
        '404': { description: Restaurante inativo ou inexistente }
  /publico/{slug}/pedidos:
    post:
      summary: Cria um pedido público recalculado no servidor; no delivery, endereço é obrigatório e pode incluir latitude/longitude opcionais para a rota privada da equipe
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
      responses:
        '201': { description: Pedido criado com token de acompanhamento }
        '409': { description: Chave idempotente reutilizada com outro payload }
        '422': { description: Item, selecao, frete, pedido minimo invalido ou restaurante fechado }
        '502': { description: Pedido salvo, mas gateway de pagamento indisponivel }
  /publico/{slug}/checkout/previa:
    post:
      summary: Recalcula itens, pedido minimo, zona, frete e total sem criar o pedido; recusa fora do horario de atendimento
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Previa com subtotal, frete, total, zona e pedido minimo }
        '422': { description: Item, selecao, endereco ou cobertura invalida }
  /publico/pedidos/{token}:
    get:
      summary: Acompanha um pedido usando token opaco, com linha do tempo, media de espera e posicao do entregador durante a rota
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Estados atuais do pedido }
  /configuracao:
    get: { summary: Obtém configuração da conta, incluindo localização, horários e mensagens de WhatsApp por etapa, security: [ { bearerAuth: [] } ], responses: { '200': { description: Configuração } } }
    put: { summary: Cria ou atualiza configuração, localização, horários e mensagens de WhatsApp com versionamento otimista, security: [ { bearerAuth: [] } ], responses: { '200': { description: Atualizada }, '201': { description: Criada }, '409': { description: Conflito de versao } } }
  /cardapio:
    get: { summary: Lista itens administrativos por pagina, security: [ { bearerAuth: [] } ], responses: { '200': { description: Itens e metadados } } }
    post: { summary: Adiciona produto existente ao cardapio, security: [ { bearerAuth: [] } ], responses: { '201': { description: Item criado } } }
  /cardapio/produtos:
    get: { summary: Lista produtos ativos disponiveis para composicao do cardapio, security: [ { bearerAuth: [] } ], responses: { '200': { description: Produtos da conta } } }
  /cardapio/{id}:
    patch:
      summary: Atualiza item do cardapio e seus grupos usando versionamento otimista
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Item atualizado }
        '409': { description: Conflito de versao }
  /grupos-opcoes:
    get: { summary: Lista grupos de sabores e complementos da conta, security: [ { bearerAuth: [] } ], responses: { '200': { description: Grupos e opcoes } } }
    post: { summary: Cria grupo de sabores ou complementos, security: [ { bearerAuth: [] } ], responses: { '201': { description: Grupo criado }, '422': { description: Limites ou opcoes invalidos } } }
  /grupos-opcoes/{id}:
    patch:
      summary: Atualiza grupo e substitui suas opcoes preservando snapshots de pedidos
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Grupo atualizado }
        '422': { description: Limites ou opcoes invalidos }
  /zonas-entrega:
    get: { summary: Lista zonas de entrega isoladas pela conta autenticada, security: [ { bearerAuth: [] } ], responses: { '200': { description: Zonas ordenadas por prioridade } } }
    post: { summary: Cria zona por cidade, bairros e intervalo de CEP, security: [ { bearerAuth: [] } ], responses: { '201': { description: Zona criada }, '422': { description: Regra de zona invalida } } }
  /zonas-entrega/{id}:
    patch:
      summary: Atualiza zona usando versionamento otimista
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Zona atualizada }
        '409': { description: Conflito de versao ou nome }
  /mesas:
    get: { summary: Lista o salao com sessoes, comandas e pedidos ativos, security: [ { bearerAuth: [] } ], responses: { '200': { description: Mesas da conta } } }
    post: { summary: Cadastra uma mesa, security: [ { bearerAuth: [] } ], responses: { '201': { description: Mesa criada }, '409': { description: Nome duplicado } } }
  /mesas/{id}:
    patch: { summary: Atualiza uma mesa usando versionamento otimista, security: [ { bearerAuth: [] } ], responses: { '200': { description: Mesa atualizada }, '409': { description: Conflito de versao } } }
  /mesas/{id}/abrir:
    post: { summary: Abre uma sessao e cria a comanda principal da mesa, security: [ { bearerAuth: [] } ], responses: { '201': { description: Atendimento aberto }, '409': { description: Mesa ocupada } } }
  /mesas/{id}/aguardar-conta:
    post: { summary: Fecha os lancamentos e deixa as comandas pendentes de faturamento, security: [ { bearerAuth: [] } ], responses: { '200': { description: Conta solicitada } } }
  /mesas/{id}/liberar:
    post: { summary: Encerra a sessao depois do faturamento e envia a mesa para limpeza, security: [ { bearerAuth: [] } ], responses: { '200': { description: Mesa em limpeza }, '422': { description: Existem comandas abertas } } }
  /mesas/{id}/finalizar-limpeza:
    post: { summary: Marca uma mesa em limpeza como livre, security: [ { bearerAuth: [] } ], responses: { '200': { description: Mesa livre } } }
  /sessoes-mesa/{id}/pedidos:
    post: { summary: Lanca pedido interno, debita estoque transacional e despacha tickets ao KDS, security: [ { bearerAuth: [] } ], responses: { '201': { description: Pedido enviado e estoque auditado }, '422': { description: Selecao, estoque ou sessao invalida, ou item sem categoria roteada para ponto KDS ativo } } }
  /pontos-producao:
    get: { summary: Lista pontos e roteamentos de producao, security: [ { bearerAuth: [] } ], responses: { '200': { description: Pontos da conta } } }
    post: { summary: Cria ponto e associa categorias obrigatorias, security: [ { bearerAuth: [] } ], responses: { '201': { description: Ponto criado } } }
  /pontos-producao/{id}:
    patch: { summary: Atualiza ponto e substitui o roteamento por categoria, security: [ { bearerAuth: [] } ], responses: { '200': { description: Ponto atualizado }, '409': { description: Conflito de versao } } }
  /pontos-producao/categorias:
    get: { summary: Lista categorias disponiveis para roteamento, security: [ { bearerAuth: [] } ], responses: { '200': { description: Categorias ativas } } }
  /kds:
    get: { summary: Feed operacional de tickets por ponto e status, security: [ { bearerAuth: [] } ], responses: { '200': { description: Tickets ativos } } }
  /kds/{id}/transicao:
    post: { summary: Avanca um ticket e sincroniza o estado global do pedido, security: [ { bearerAuth: [] } ], responses: { '200': { description: Ticket atualizado }, '409': { description: Conflito de versao }, '422': { description: Transicao invalida } } }
  /kds/{id}/reimprimir:
    post: { summary: Enfileira novas vias do ticket em todas as saidas simultaneas da regra ativa, security: [ { bearerAuth: [] } ], responses: { '201': { description: Trabalhos criados por saida }, '422': { description: Regra de impressao nao configurada } } }
  /estacoes-impressao:
    get: { summary: Lista estacoes sem expor o hash do token, security: [ { bearerAuth: [] } ], responses: { '200': { description: Estacoes e estado de presenca } } }
    post: { summary: Cria estacao e retorna o token de pareamento uma unica vez, security: [ { bearerAuth: [] } ], responses: { '201': { description: Estacao e pairingToken } } }
  /estacoes-impressao/{id}:
    patch: { summary: Atualiza nome e estado da estacao, security: [ { bearerAuth: [] } ], responses: { '200': { description: Estacao atualizada }, '409': { description: Conflito de versao } } }
  /estacoes-impressao/{id}/regenerar-token:
    post: { summary: Invalida o token anterior e retorna um novo token uma unica vez, security: [ { bearerAuth: [] } ], responses: { '200': { description: Novo pairingToken } } }
  /regras-impressao:
    get: { summary: Lista regras por ponto de producao, security: [ { bearerAuth: [] } ], responses: { '200': { description: Regras } } }
    put: { summary: Cria ou atualiza regra com uma ou mais saidas simultaneas e contingencia individual, security: [ { bearerAuth: [] } ], responses: { '200': { description: Regra atualizada }, '201': { description: Regra criada } } }
  /trabalhos-impressao:
    get: { summary: Lista os ultimos trabalhos e seus estados, security: [ { bearerAuth: [] } ], responses: { '200': { description: Trabalhos } } }
  /estacao-impressao/heartbeat:
    post: { summary: Atualiza presenca e impressora local da estacao, security: [ { printStationToken: [] } ], responses: { '200': { description: Presenca atualizada }, '401': { description: Token invalido } } }
  /estacao-impressao/trabalhos:
    get: { summary: Reserva trabalhos pendentes com lease temporario, security: [ { printStationToken: [] } ], responses: { '200': { description: Trabalhos reservados }, '401': { description: Token invalido } } }
  /estacao-impressao/trabalhos/ack:
    post: { summary: Confirma sucesso ou falha de um trabalho reservado, security: [ { printStationToken: [] } ], responses: { '200': { description: Estado atualizado }, '409': { description: Lease expirado } } }
  /pedidos:
    get:
      summary: Lista pedidos da conta por página, com status e período opcionais
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: status, in: query, description: Um ou mais status separados por vírgula, schema: { type: string } }
        - { name: inicio, in: query, description: Data/hora ISO 8601 inclusiva, schema: { type: string, format: date-time } }
        - { name: fim, in: query, description: Data/hora ISO 8601 inclusiva, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Pedidos e metadados }
        '422': { description: Período inválido }
  /pedidos/{id}/transicao:
    post:
      summary: Executa transicao valida usando version
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Pedido atualizado }
        '409': { description: Conflito de versao }
        '422': { description: Transicao ou estoque invalido; cancelamento devolve debitos ainda ativos }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    printStationToken: { type: apiKey, in: header, name: X-Print-Station-Token }
